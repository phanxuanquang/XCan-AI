<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XCan — Image to Markdown, on your device</title>
  <meta name="description" content="Free image to Markdown converter (OCR) that runs entirely in your browser with the built-in AI in Chrome and Edge. Your image never leaves your device.">
  <link rel="canonical" href="https://phanxuanquang.github.io/XCan-AI/">
  <meta name="theme-color" content="#F2F2F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="XCan">
  <meta property="og:title" content="XCan — Image to Markdown, on your device">
  <meta property="og:description" content="Turn a screenshot, scan or photo into Markdown with your browser's built-in AI. The image never leaves your device.">
  <meta property="og:url" content="https://phanxuanquang.github.io/XCan-AI/">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="XCan — Image to Markdown, on your device">
  <meta name="twitter:description" content="Turn a screenshot, scan or photo into Markdown with your browser's built-in AI. The image never leaves your device.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "XCan",
    "url": "https://phanxuanquang.github.io/XCan-AI/",
    "description": "Converts an image (screenshot, scan or photo) into Markdown using the browser's built-in on-device AI. The image is processed locally and never uploaded.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires Google Chrome or Microsoft Edge with the built-in Prompt API (on-device language model).",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": ["Image to Markdown (OCR)", "Runs on-device in the browser", "No upload, no account"],
    "sameAs": "https://github.com/phanxuanquang/XCan-AI"
  }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="container-xl px-3 px-md-4">
    <header class="app-header">
      <a class="wordmark me-auto" href="./" data-bs-title="Image to Markdown with your browser's built-in AI. Nothing is uploaded." data-bs-placement="bottom">
        <span class="material-symbols-rounded" aria-hidden="true">document_scanner</span>XCan
      </a>
      <span id="status-pill" class="status-dot" data-state="idle" role="status" tabindex="0"
        aria-label="Checking built-in AI" data-bs-title="Checking built-in AI" data-bs-placement="bottom"><span class="dot"></span></span>
      <a class="icon-btn" href="https://github.com/phanxuanquang/XCan-AI" target="_blank" rel="noopener noreferrer"
        aria-label="Source code on GitHub" data-bs-title="Source code on GitHub" data-bs-placement="bottom">
        <span class="material-symbols-rounded" aria-hidden="true">code</span>
      </a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme" data-bs-title="Switch theme" data-bs-placement="bottom">
        <span class="material-symbols-rounded" aria-hidden="true">dark_mode</span>
      </button>
    </header>

    <main>
      <h1 class="visually-hidden">XCan: image to Markdown on your device</h1>

      <noscript>
        <p>XCan needs JavaScript. It turns a screenshot, scan or photo into Markdown using the built-in AI in Google Chrome or Microsoft Edge, entirely on your device. Enable JavaScript and reload the page.</p>
      </noscript>

      <!-- Model setup details; shown only when the user needs to act. -->
      <!-- Boot screen: shown until the model session is ready; the workspace stays hidden until then. -->
      <section id="boot" class="boot" aria-live="polite" aria-busy="true">
        <span id="boot-spinner" class="spinner-border" aria-hidden="true"></span>
        <div id="model-status" class="boot-body">
          <strong>Preparing XCan</strong>
          <span>Checking your browser's built-in AI…</span>
        </div>
      </section>

      <!-- data-view: "input" shows only the drop pane; "result" shows only the live preview. -->
      <div id="workspace" class="workspace" data-view="input" hidden>
        <section class="pane source-pane" aria-label="Source image">
          <label id="dropzone" for="file-input">
            <span id="drop-hint" class="drop-hint">
              <span class="material-symbols-rounded" aria-hidden="true">add_photo_alternate</span>
              <strong><span class="hint-desktop">Drop, choose or paste an image</span><span class="hint-touch">Tap to choose or take a photo</span></strong>
              <span>PNG, JPG, WEBP or GIF up to 10 MB</span>
            </span>
          </label>
          <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="visually-hidden">
        </section>

        <section id="output" class="pane result-pane" aria-label="Markdown result">
          <div class="pane-head">
            <span id="scan-frame" class="scan-frame" data-bs-title="Image being converted">
              <img id="preview-image" alt="Image being converted">
              <span class="scan-sweep" aria-hidden="true"></span>
              <span class="scan-line" aria-hidden="true"></span>
            </span>

            <ul class="nav segmented" role="tablist">
              <li role="presentation" data-bs-title="Preview">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-preview" type="button" role="tab"
                  aria-controls="tab-preview" aria-selected="true" aria-label="Preview">
                  <span class="material-symbols-rounded" aria-hidden="true">article</span>
                </button>
              </li>
              <li role="presentation" data-bs-title="Edit Markdown">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-code" type="button" role="tab"
                  aria-controls="tab-code" aria-selected="false" aria-label="Edit Markdown">
                  <span class="material-symbols-rounded" aria-hidden="true">markdown</span>
                </button>
              </li>
            </ul>

            <span id="loading" class="progress-chip d-none" role="status" aria-live="polite">
              <span class="spinner-grow spinner-grow-sm" aria-hidden="true"></span>
              <span id="loading-text" class="visually-hidden">Reading the image</span>
              <span id="loading-time">0 s</span>
            </span>

            <div class="result-tools">
              <button id="stop-btn" class="icon-btn is-danger d-none" type="button" aria-label="Stop" data-bs-title="Stop">
                <span class="material-symbols-rounded" aria-hidden="true">stop_circle</span>
              </button>
              <button id="generate-btn" class="icon-btn" type="button" disabled aria-label="Convert again" data-bs-title="Convert again">
                <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
              </button>
              <button id="revert-btn" class="icon-btn d-none" type="button" aria-label="Undo my edits" data-bs-title="Undo my edits">
                <span class="material-symbols-rounded" aria-hidden="true">undo</span>
              </button>
              <button id="copy-btn" class="icon-btn" type="button" aria-label="Copy Markdown" data-bs-title="Copy Markdown" disabled>
                <span class="material-symbols-rounded" aria-hidden="true">content_copy</span>
              </button>
              <button id="download-btn" class="icon-btn" type="button" aria-label="Download .md" data-bs-title="Download .md" disabled>
                <span class="material-symbols-rounded" aria-hidden="true">download</span>
              </button>
              <button id="clear-btn" class="icon-btn is-primary" type="button" aria-label="New image" data-bs-title="New image">
                <span class="material-symbols-rounded" aria-hidden="true">add_photo_alternate</span>
              </button>
            </div>
          </div>

          <div id="error" class="notice result-error d-none" role="alert"></div>

          <div class="tab-content">
            <div id="tab-preview" class="tab-pane fade show active paper" role="tabpanel" tabindex="0">
              <div id="empty-result" class="paper-empty">
                <span class="material-symbols-rounded" aria-hidden="true">draft</span>
                <span>Markdown appears here</span>
              </div>
              <div id="preview-skeleton" class="skeleton d-none" aria-hidden="true">
                <span class="placeholder lg w-50"></span>
                <span class="placeholder w-100"></span>
                <span class="placeholder w-75"></span>
                <span class="placeholder w-100"></span>
                <span class="placeholder w-25 mt-4"></span>
                <span class="placeholder w-100"></span>
                <span class="placeholder w-50"></span>
              </div>
              <article id="output-rendered" class="paper-inner d-none"></article>
            </div>
            <div id="tab-code" class="tab-pane fade" role="tabpanel">
              <label for="output-code" class="visually-hidden">Markdown source (editable)</label>
              <textarea id="output-code" spellcheck="false"></textarea>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Setup / help dialog (Bootstrap modal): model download, unsupported browser or device. -->
  <div id="info-dialog" class="modal fade" tabindex="-1" aria-labelledby="info-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="info-title" class="modal-title fs-5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="info-body" class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn-quiet" data-bs-dismiss="modal">Close</button>
          <button id="info-confirm" type="button" class="btn-ink"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div id="toast-body" class="toast-body"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@4.4.1/dist/bundles/anime.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
