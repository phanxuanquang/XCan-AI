# Deploy the static site in src/ to GitHub Pages.
# Based on GitHub's starter workflow: https://github.com/actions/starter-workflows/blob/main/pages/static.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
